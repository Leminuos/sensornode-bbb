# Daemon chỉ cần /data và thư mục của SensorNode, không chờ sysinit.target và basic.target.
[Unit]
DefaultDependencies=no
Wants=sensornode-early-tmpfiles.service
After=sensornode-early-tmpfiles.service
Conflicts=shutdown.target
Before=shutdown.target

# PrivateTmp kéo theo After=systemd-tmpfiles-setup.service. Daemon không dùng /tmp.
# Nice ưu tiên CPU cho đường khởi động HMI khi boot phải tranh CPU với udev/networkd.
[Service]
PrivateTmp=no
Nice=-10
